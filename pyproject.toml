[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"
[project]
name = "ilandymc"
version = "1.0.0"
description = "Your Minecraft Server. One Command Away."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["typer>=0.12,<1", "rich>=13.7,<15", "textual>=0.70,<2", "pydantic>=2.7,<3", "httpx>=0.27,<1", "PyYAML>=6,<7", "platformdirs>=4,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.5,<1"]
[project.scripts]
ilandy = "ilandymc.main:app"
ily = "ilandymc.main:tui_entry"
[tool.hatch.build.targets.wheel]
packages = ["ilandymc"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel.force-include]
"ilandymc/data/server.properties" = "ilandymc/data/server.properties"
